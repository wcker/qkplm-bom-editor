name: DCO

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: node scripts/check-dco.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
